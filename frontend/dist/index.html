    <title>MindBridge</title>
    <script>
      // apply the saved theme before first paint (prevents a light flash in dark mode)
      (function () {
        try {
          var p = localStorage.getItem("mindbridge-theme") || "system";
          var dark = p === "dark" || (p === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) { document.documentElement.dataset.theme = "light"; }
      })();
    </script>
